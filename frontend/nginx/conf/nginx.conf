worker_processes 1;
error_log logs/error.log info;
pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    sendfile on;

    server {
        listen 8090;
        server_name localhost;

        # 前端构建产物（npm run build 的 dist）
        location / {
            root "D:/rag_project/jianshen-rag/frontend/dist";
            try_files $uri $uri/ /index.html;   # Vue history 路由回退
        }

        # 接口反代 FastAPI（8000）；SSE 流式必须关闭缓冲
        location /api/ {
            proxy_pass http://127.0.0.1:8000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;               # SSE 逐字输出，否则卡成整段
            proxy_cache off;
            proxy_read_timeout 300s;           # 长连接流式回答不超时
        }
    }
}